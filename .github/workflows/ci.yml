name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: [stable, "1.85"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal && rustup default "$TOOLCHAIN"
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          persona: pedantic

  action:
    name: action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and put harness-blast on PATH
        run: |
          cargo build --locked --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Audit a risky fixture
        id: risky
        uses: $/
        with:
          path: tests/fixtures/risky/project
          install: "false"
          fail-on-findings: "false"
      - name: Check findings and SARIF
        env:
          CODE: ${{ steps.risky.outputs.exit-code }}
          SARIF: ${{ steps.risky.outputs.sarif-file }}
        run: |
          test "$CODE" = 13
          jq -e '.runs[0].results | length > 0' "$SARIF"
          jq -e '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | all(startswith("tests/fixtures/risky/project/"))' "$SARIF"
      - name: Accept the findings in a baseline
        run: HOME="$RUNNER_TEMP" harness-blast audit tests/fixtures/risky/project --managed-dir "$RUNNER_TEMP/none" --write-baseline "$RUNNER_TEMP/baseline.json"
      - name: Audit with the baseline
        id: accepted
        uses: $/
        with:
          path: tests/fixtures/risky/project
          install: "false"
          baseline: ${{ runner.temp }}/baseline.json
      - run: test "$CODE" = 0
        env:
          CODE: ${{ steps.accepted.outputs.exit-code }}
      - name: Audit with the released binary
        id: released
        uses: $/
        with:
          path: tests/fixtures/risky/project
          fail-on-findings: "false"
          sarif-file: ${{ runner.temp }}/released.sarif
      - run: test "$CODE" = 13
        env:
          CODE: ${{ steps.released.outputs.exit-code }}
