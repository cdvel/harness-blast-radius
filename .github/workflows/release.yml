name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag matches Cargo.toml and action.yml versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME"
          grep -A2 '^  version:' action.yml | grep -q "default: \"$version\""
      - run: rustup toolchain install stable --profile minimal -t "$TARGET" && rustup default stable
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo build --locked --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Package
        run: |
          name="harness-blast-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/harness-blast" LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-blast-${{ matrix.target }}
          path: harness-blast-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign build provenance attestations
      attestations: write # store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: harness-blast-*
          merge-multiple: true
      - run: sha256sum harness-blast-*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: harness-blast-*.tar.gz
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes harness-blast-*.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
